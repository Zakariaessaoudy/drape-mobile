spring.application.name=fullstack-demo

# Datasource — defaults work for local docker-compose; override via env in prod.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wardrobe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wardrobe}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wardrobe}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — override the secret in production via env var APP_JWT_SECRET.
# Must be at least 32 bytes (256 bits) for HS256.
app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
app.jwt.expiration-ms=86400000

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.callback-secret=${AI_CALLBACK_SECRET:local-ai-secret}
